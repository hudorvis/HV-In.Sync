name: In.Sync
run-name: In.Sync v26.11.24.01

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile iPhone and iPad target
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build Release for iOS devices
        run: |
          xcodebuild -project InSync.xcodeproj -scheme InSync \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/insync-device" CODE_SIGNING_ALLOWED=NO build
      - name: Build Debug for the iOS Simulator
        run: |
          xcodebuild -project InSync.xcodeproj -scheme InSync \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/insync-simulator" CODE_SIGNING_ALLOWED=NO build
      - name: Capture App Store screenshots
        run: |
          bash scripts/capture-app-store-screenshots.sh \
            "$RUNNER_TEMP/insync-simulator/Build/Products/Debug-iphonesimulator/In.Sync.app" \
            "$RUNNER_TEMP/app-store-screenshots"
      - name: Upload App Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: In.Sync-v26.11.24.01-App-Store-Screenshots
          path: ${{ runner.temp }}/app-store-screenshots/*.jpg
          if-no-files-found: error
